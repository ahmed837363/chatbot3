name: Deploy to Appwrite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
      # Optional: set to "true" only if you use a self-signed Appwrite endpoint.
      APPWRITE_SELF_SIGNED: ${{ secrets.APPWRITE_SELF_SIGNED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Validate Appwrite secrets
        run: |
          echo "Checking secrets..."
          MISSING=""
          if [ -z "$APPWRITE_ENDPOINT" ]; then echo "APPWRITE_ENDPOINT: NOT SET"; MISSING="1"; else echo "APPWRITE_ENDPOINT: set"; fi
          if [ -z "$APPWRITE_PROJECT_ID" ]; then echo "APPWRITE_PROJECT_ID: NOT SET"; MISSING="1"; else echo "APPWRITE_PROJECT_ID: set"; fi
          if [ -z "$APPWRITE_API_KEY" ]; then echo "APPWRITE_API_KEY: NOT SET"; MISSING="1"; else echo "APPWRITE_API_KEY: set"; fi
          if [ -z "$APPWRITE_SITE_ID" ]; then echo "APPWRITE_SITE_ID: NOT SET"; MISSING="1"; else echo "APPWRITE_SITE_ID: set"; fi

          # Debug (safe): show lengths, not values
          echo "APPWRITE_ENDPOINT length: ${#APPWRITE_ENDPOINT}"
          echo "APPWRITE_PROJECT_ID length: ${#APPWRITE_PROJECT_ID}"
          echo "APPWRITE_API_KEY length: ${#APPWRITE_API_KEY}"
          echo "APPWRITE_SITE_ID length: ${#APPWRITE_SITE_ID}"

          # Debug (safe): show endpoint origin only
          if [ -n "$APPWRITE_ENDPOINT" ]; then
            ORIGIN=$(echo "$APPWRITE_ENDPOINT" | sed -E 's#(https?://[^/]+).*#\1#')
            echo "APPWRITE_ENDPOINT origin: $ORIGIN"
          fi

          if [ -n "$MISSING" ]; then
            echo "One or more secrets are missing. Add them at: GitHub repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Deploy to Appwrite Hosting
        run: |
          set -euo pipefail
          appwrite --version

          echo "Deploying… (safe debug)"
          echo "Site ID length: ${#APPWRITE_SITE_ID}"

          SELF_SIGNED_FLAG=""
          if [ "${APPWRITE_SELF_SIGNED:-}" = "true" ]; then
            SELF_SIGNED_FLAG="--selfSigned true"
          fi

          appwrite client --endpoint "$APPWRITE_ENDPOINT" --projectId "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY" $SELF_SIGNED_FLAG
          appwrite deploy hosting --site-id "$APPWRITE_SITE_ID" --entrypoint dist
