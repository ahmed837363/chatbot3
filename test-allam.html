<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الشات بوت - ALLaM 🇸🇦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a5c1a 0%, #0d3d0d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
            margin-bottom: 100px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .flag {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 500px;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 20px 30px;
            border-radius: 15px;
            margin-top: 30px;
            text-align: right;
        }
        .instructions h3 {
            margin-bottom: 15px;
        }
        .instructions ul {
            list-style: none;
            line-height: 2;
        }
    </style>
</head>
<body>
    <div class="status">✅ ALLaM متصل - LM Studio</div>
    
    <div class="container">
        <div class="flag">🇸🇦</div>
        <h1>مساعد علّام</h1>
        <p>شات بوت ذكي باللهجة السعودية - مدعوم بنموذج علّام من هيئة البيانات والذكاء الاصطناعي</p>
        <div class="badge">🤖 ALLaM-7B by SDAIA</div>
        
        <div class="instructions">
            <h3>جرب تسأله:</h3>
            <ul>
                <li>💬 "هلا، وش عندكم اليوم؟"</li>
                <li>💬 "كم سعر الشحن؟"</li>
                <li>💬 "متى يوصل الطلب؟"</li>
                <li>💬 "ابي استرجع طلبي"</li>
            </ul>
        </div>
    </div>

    <!-- Chatbot Widget -->
    <script src="chatbot-widget.js" data-store-id="test-allam"></script>
</body>
</html>
