<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salla OAuth Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { color: #333; }
        p { color: #666; margin: 20px 0; }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .button:hover { background: #764ba2; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Chatbot OAuth Test</h1>
        <p>Click below to authorize your Salla store</p>
        
        <button class="button" onclick="startOAuth()">
            Connect Salla Store
        </button>
        
        <button class="button" onclick="checkStatus()" style="background: #28a745;">
            Check Status
        </button>

        <div class="info">
            <strong>Status:</strong> <span id="status">Not connected</span><br>
            <strong>Store ID:</strong> <span id="storeId">None</span><br>
            <strong>Callback URL:</strong> <code>http://localhost:3000/oauth-callback</code>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'd57bh-4f5-ed26-4a09-Babo-03e9384dfd894';
        const REDIRECT_URI = 'http://localhost:3000/oauth-callback';
        const SALLA_OAUTH_URL = 'https://accounts.salla.sa/oauth/authorize';

        function startOAuth() {
            const state = Math.random().toString(36).substring(7);
            localStorage.setItem('oauth_state', state);
            
            const authUrl = `${SALLA_OAUTH_URL}?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&state=${state}&scope=stores:read`;
            
            window.location.href = authUrl;
        }

        function checkStatus() {
            const stored = localStorage.getItem('salla_store');
            if (stored) {
                const store = JSON.parse(stored);
                document.getElementById('status').textContent = '✅ Connected';
                document.getElementById('storeId').textContent = store.id;
            } else {
                document.getElementById('status').textContent = '❌ Not connected';
            }
        }

        // Check if we're the callback page
        if (window.location.pathname === '/oauth-callback') {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            
            if (code && state === localStorage.getItem('oauth_state')) {
                document.body.innerHTML = '<div class="container"><h1>✅ Authorization Successful!</h1><p>Your store has been connected. Webhook should trigger now...</p><a href="/" class="button">Back to Test Page</a></div>';
                
                // Store the code (in real app, exchange for token)
                localStorage.setItem('salla_store', JSON.stringify({
                    id: 'demo_store_' + Date.now(),
                    code: code,
                    connectedAt: new Date().toISOString()
                }));
            }
        }

        // Check status on load
        checkStatus();
    </script>
</body>
</html>
