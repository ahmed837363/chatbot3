name = "ai-smart-assistant"
main = "index.js"
compatibility_date = "2025-01-01"
account_id = "your-account-id"  # replace with the value from Cloudflare dashboard
workers_dev = true

# Routes for your domain
# route = { pattern = "mayasahstyle.me/*", zone_id = "your-zone-id" }

[vars]
# Appwrite function URL - set this to your deployed function URL
APPWRITE_FUNCTION_URL = "https://YOUR-FUNCTION-ID.fra.appwrite.run/"
# Local AI URL (for Cloudflare Tunnel)
AI_LOCAL_URL = "http://192.168.1.4:1234"
